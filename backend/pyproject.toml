[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bim-insight-backend"
version = "0.12.0"
description = "Local IFC processing and project metadata for BIM Insight"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pymongo>=4.11,<5",
  "ifcopenshell>=0.8,<0.9",
  "psutil>=6,<8",
  "boto3>=1.36,<2",
  "pypdf>=6.21,<7",
  "python-multipart>=0.0.20,<1",
  "ezdxf==1.4.5",
  "pillow>=13,<14",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2>=2.16,<3", "huggingface-hub>=0.34,<1", "pyinstaller>=6.22,<7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["qwen-model.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
markers = ["integration: requires a local MongoDB instance"]
